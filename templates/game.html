<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <title>Double or nothing</title>
  
</head>
<body>


  <p>Playing as {{ username }}</p>

  <div class="score-parent" id="score-parent">
    <h1>YOUR SCORE</h1>
    <h1 id="score" style="color: #3a2dd2;">{{score}}</h1>
  </div>





  <div class="coin-container">
    <div class="coin" id="coin">
      <div class="coin-front" id="coin-front">FLIP</div>
      <div class="coin-back">x2</div>

    </div>
      <p id="coinResult" class="coin-result">You are not supposed to see this</p>
  </div>







  <h1>Top 5</h1>
 <table id="leaderboard">
    <tr><th>Username</th><th>Score</th></tr>
    {% for entry in leaderboard %}
      <tr>
        <td>{{ entry[0] }}</td>
        <td>{{ entry[1] }}</td>
      </tr>
    {% endfor %}
  </table>




<script>

console.log("🎮 Game loaded!");

document.addEventListener('DOMContentLoaded', function() {
  console.log("📄 DOM ready!");
  
  const coin = document.getElementById('coin');
  const scoreEl = document.getElementById('score');
  const scoreParent = document.getElementById('score-parent')
  const coinResult = document.getElementById('coinResult');
  const coinFront = document.getElementById("coin-front");
  const resultMessage = document.getElementById('resultMessage');
  

  async function refreshLeaderboard() {
    try {
      const response = await fetch("/api/get-leaderboard");
      const data = await response.json();
      const table = document.getElementById("leaderboard");
      const username = data.username;
      const userScore = data.user_score;
      let isUser = false;
      
      let html = `<tr><th>Username</th><th>Score</th></tr>`;
        
        
        
        data.leaderboard.forEach(entry => {

          if (entry[0] == username) {
            isUser = true;

            html += `
              <tr>
                <td style="color: #3a2dd2;">${entry[0]}</td>
                <td style="color: #3a2dd2;">${entry[1]}</td>
              </tr>
            `;
        
          }

          else{
            html += `
            <tr>
              <td>${entry[0]}</td>
              <td>${entry[1]}</td>
            </tr>
            `;

          }
        });


        
        table.innerHTML = html;
    }
     catch (error) {
      console.error("Leaderboard error:", error);
    }
  }
  



  // Initial leaderboard load
  refreshLeaderboard();  


let flipInProgress = false;
let hideTimeout = null;




async function flipCoin() {
  

  if (flipInProgress) return;
  flipInProgress = true;

  if (coin) coin.style.pointerEvents = 'none';

  if (hideTimeout) {
    clearTimeout(hideTimeout);
    hideTimeout = null;
  }

  // Hide any previous result instantly
  if (coinResult) coinResult.classList.remove('show');
  if (resultMessage) resultMessage.classList.remove('show');
  
  

  try {
    let newScore;
    const isWin = [false,true,true,true,true][Math.floor(Math.random()*4)]
    if (isWin){
      newScore = 2*scoreEl.textContent;    
    }else{
      newScore = 20;
    }


    
    // --- Coin flip animation ---
    setTimeout(() => {
    coinFront.textContent = '❌';
    }, 200);


    const spins = 3;
    const baseRotation = !isWin ? 0 : 180;
    const totalRotation = spins * 360 + baseRotation;

    coin.style.transition = 'none';
    coin.style.transform = 'rotateY(0deg)';
    void coin.offsetHeight; // force reflow
    coin.style.transition = 'transform 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    coin.style.transform = `rotateY(${totalRotation}deg)`;
    
    // Wait for animation to finish
    await new Promise(resolve => setTimeout(resolve, 1500));

    // --- Show result ---
    const resultText = isWin ? '🍀 X2 SCORE!' : '💀 LOSE YOUR SCORE!';
    if (coinResult) {
      coinResult.textContent = resultText;
      coinResult.className = 'coin-result show ' + (isWin ? 'win' : 'lose');
    }
    if (resultMessage) {
      resultMessage.textContent = resultText;
      resultMessage.className = 'result-message show ' + (isWin ? 'win' : 'lose');
    }

    // Update score
    scoreEl.textContent = newScore;
    scoreEl.style.color = isWin ? '#2ecc71' : '#f25914';
    

    scoreEl.classList.remove('scale-up-vertical-center');
    void scoreEl.offsetHeight;
    scoreEl.classList.add('scale-up-vertical-center');


    await fetch('/api/updateScore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 'newScore':  newScore})
    });

    setTimeout(() => {
      scoreEl.style.color = '#3a2dd2';
    }, 1300);

    
    

  
    
    

    await refreshLeaderboard();

    // No delay bc the delay is made by the time the databse fetch take
    
    if (coinResult) coinResult.classList.remove('show');
    if (resultMessage) resultMessage.classList.remove('show');
    if (coin) coin.style.pointerEvents = 'auto';
    flipInProgress = false;
    hideTimeout = null;
    

    

  } catch (error) {
    console.error("Flip error:", error);
    
    // Re‑enable on error
    if (coin) coin.style.pointerEvents = 'auto';
    flipInProgress = false;
  }

    
}

  coin.addEventListener('click', flipCoin);
  console.log("✅ Game ready!");
});

  </script>

</body>

</html>
